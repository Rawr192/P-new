name: Download Video from url to google photos

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Lim inn URL-en til videoen du vil laste ned'
        required: true
        type: string
      target_date:
        description: 'Dato/tid for metadata (ÅÅÅÅ-MM-DD eller ÅÅÅÅ-MM-DD HH:MM:SS)'
        required: false
        default: '2026-10-04 13:00'
        type: string
      gotohp_creds_key:
        description: 'Google Photos (gotohp) legitimasjonsnøkkel / Creds Key'
        required: true
        type: string
      gotohp_user_email:
        description: 'Din Google-e-postadresse'
        required: true
        type: string

env:
  TZ: "Europe/Oslo"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kodebasen
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer FFmpeg, yt-dlp og curl_cffi
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # Her installeres curl_cffi sammen med yt-dlp
          pip install "yt-dlp[default,curl-cffi]"

      - name: Installer gotohp-cli
        run: |
          curl -sL "https://github.com" -o /usr/local/bin/gotohp-cli
          chmod +x /usr/local/bin/gotohp-cli
          gotohp-cli --version || true

      - name: Last ned videoen i beste kvalitet med curl_cffi
        id: download_step
        run: |
          mkdir downloads
          cd downloads
          
          # yt-dlp bruker curl_cffi automatisk her for å etterligne Chrome
          yt-dlp --impersonate chrome -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" "${{ github.event.inputs.video_url }}"

      - name: Inject Norway Metadata and Set Timestamp (Python)
        run: |
          mkdir -p processed_downloads

          python3 -c '
          import os, glob, subprocess
          from datetime import datetime, timedelta

          raw_input = "${{ inputs.target_date }}".strip()
          
          base_date = None
          matched_fmt = None
          for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%d %H:%M", "%Y-%m-%d"):
              try:
                  base_date = datetime.strptime(raw_input, fmt)
                  matched_fmt = fmt
                  break
              except ValueError:
                  pass

          if base_date is None:
              base_date = datetime.utcnow().replace(hour=13, minute=0, second=0)
          elif matched_fmt == "%Y-%m-%d":
              base_date = base_date.replace(hour=13, minute=0, second=0)

          current_dt = base_date
          # Endret fra "raw_downloads/*" til "downloads/*" slik at skriptet finner videoen fra yt-dlp
          raw_files = sorted(glob.glob("downloads/*"))

          for file_path in raw_files:
              if os.path.isfile(file_path):
                  orig_filename = os.path.basename(file_path)
                  out_path = os.path.join("processed_downloads", orig_filename)
                  
                  # Format ISO string with offset and inject location metadata
                  iso_creation_time = current_dt.strftime("%Y-%m-%dT%H:%M:%S") + "+02:00"

                  cmd = [
                      "ffmpeg", "-i", file_path,
                      "-map_metadata", "-1",
                      "-metadata", f"creation_time={iso_creation_time}",
                      "-metadata", "location=59.9139+10.7522/",
                      "-metadata", "location-eng=Norway",
                      "-c", "copy",
                      "-fflags", "+bitexact",
                      out_path, "-y"
                  ]
                  res = subprocess.run(cmd)
                  if res.returncode != 0:
                      subprocess.run(["cp", file_path, out_path])

                  touch_time_str = current_dt.strftime("%Y-%m-%d %H:%M:%S")
                  subprocess.run(["touch", "-d", touch_time_str, out_path], check=True)

                  current_dt += timedelta(seconds=1)
          '

      - name: Verify Processed Files and Modification Timestamps
        run: |
          echo "=== VERIFYING PROCESSED FILES (NORWAY TIME) ==="
          ls -la --time-style=full-iso processed_downloads/

      - name: Configure Credentials and Upload via gotohp-cli
        run: |
          gotohp-cli creds add "${{ inputs.gotohp_creds_key }}"
          gotohp-cli creds set "${{ inputs.gotohp_user_email }}"

          gotohp-cli upload processed_downloads --recursive --threads 5 --force --no-tui
