name: 2. Split Links into 5GB Batches

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1. Fetch and Filter MEGA Links"]
    types:
      - completed

permissions:
  actions: write
  contents: write

jobs:
  process-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Filtered Links
        uses: actions/download-artifact@v4
        with:
          name: mega-filtered-links
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Group Links into ~5GB Batches & Trigger Upload Matrix
        run: |
          python3 -c '
          import os, json, requests

          MAX_SIZE = 5 * 1024 * 1024 * 1024  # 5 GB limit
          batches = []
          current_batch = []
          current_size = 0
          folder_url = ""
          target_date = ""
          gotohp_creds_key = ""
          gotohp_user_email = ""

          file_path = "filtered_links.txt"
          if not os.path.exists(file_path):
              for root, dirs, files in os.walk("."):
                  if "filtered_links.txt" in files:
                      file_path = os.path.join(root, "filtered_links.txt")
                      break

          if os.path.exists(file_path):
              with open(file_path, "r") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue

                      if line.startswith("TARGET_DATE|"):
                          target_date = line.split("|", 1)[1]
                          continue

                      if line.startswith("GOTOHP_CREDS_KEY|"):
                          gotohp_creds_key = line.split("|", 1)[1]
                          continue

                      if line.startswith("GOTOHP_USER_EMAIL|"):
                          gotohp_user_email = line.split("|", 1)[1]
                          continue

                      if line.startswith("FOLDER_URL|"):
                          folder_url = line.split("|", 1)[1]
                          continue

                      parts = line.split("|")
                      size = int(parts[0])
                      node_id = parts[1]

                      if size > MAX_SIZE:
                          print(f"Skipping node {node_id}: file size ({size} bytes) exceeds 5GB limit.")
                          continue

                      if current_size + size > MAX_SIZE and current_batch:
                          batches.append(",".join(current_batch))
                          current_batch = []
                          current_size = 0

                      current_batch.append(node_id)
                      current_size += size

              if current_batch:
                  batches.append(",".join(current_batch))

          print(f"Generated {len(batches)} batches")

          # Create JSON string matrix array
          batches_json = json.dumps(batches)

          token = "${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}"
          repo = "${{ github.repository }}"
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/jdownloader-download-and-release.yml/dispatches"

          payload = {
              "ref": "main",
              "inputs": {
                  "folder_url": folder_url,
                  "target_date": target_date,
                  "gotohp_creds_key": gotohp_creds_key,
                  "gotohp_user_email": gotohp_user_email,
                  "batches_matrix": batches_json
              }
          }
          res = requests.post(dispatch_url, headers=headers, json=payload)
          print(f"Triggered Matrix Workflow status: {res.status_code}")
          '
