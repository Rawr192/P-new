name: 2. Split Links into 5GB Batches

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1. Fetch and Filter MEGA Links"]
    types:
      - completed

permissions:
  actions: write
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  process-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Filtered Links
        uses: actions/download-artifact@v4
        with:
          name: mega-filtered-links
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Group Links into ~5GB Batches & Trigger Downloads
        run: |
          python3 -c '
          import os, json, requests

          MAX_SIZE = 5 * 1024 * 1024 * 1024  # 5 GB
          batches = []
          current_batch = []
          current_size = 0

          file_path = "filtered_links.txt"
          if not os.path.exists(file_path):
              for root, dirs, files in os.walk("."):
                  if "filtered_links.txt" in files:
                      file_path = os.path.join(root, "filtered_links.txt")
                      break

          if os.path.exists(file_path):
              with open(file_path, "r") as f:
                  for line in f:
                      if not line.strip():
                          continue
                      parts = line.strip().split("|")
                      size = int(parts[0])
                      url = parts[-1].split()[-1]

                      if current_size + size > MAX_SIZE and current_batch:
                          batches.append(current_batch)
                          current_batch = []
                          current_size = 0

                      current_batch.append(url)
                      current_size += size

              if current_batch:
                  batches.append(current_batch)

          print(f"Generated {len(batches)} batches.")

          # Use Personal Access Token if provided, fallback to GITHUB_TOKEN
          token = "${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}"
          repo = "${{ github.repository }}"
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          for i, batch in enumerate(batches):
              urls_str = ",".join(batch)
              tag_name = f"v1.0.0-batch-{i+1}"
              payload = {
                  "ref": "main",
                  "inputs": {
                      "urls": urls_str,
                      "release_tag": tag_name
                  }
              }
              url = f"https://api.github.com/repos/{repo}/actions/workflows/jdownloader-download-and-release.yml/dispatches"
              res = requests.post(url, headers=headers, json=payload)
              print(f"Triggered batch {i+1}: Status {res.status_code}")
          '
