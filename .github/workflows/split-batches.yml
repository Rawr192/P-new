name: 2. Split Links into 5GB Batches

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1. Fetch and Filter MEGA Links"]
    types:
      - completed

permissions:
  actions: write
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  process-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Filtered Links
        uses: actions/download-artifact@v4
        with:
          name: mega-filtered-links
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Group Links into ~5GB Batches & Trigger downloads2
        run: |
          python3 -c '
          import os, json, requests

          MAX_SIZE = 5 * 1024 * 1024 * 1024  # 5 GB
          batches = []
          current_batch = []
          current_size = 0
          folder_url = ""

          file_path = "filtered_links.txt"
          if not os.path.exists(file_path):
              for root, dirs, files in os.walk("."):
                  if "filtered_links.txt" in files:
                      file_path = os.path.join(root, "filtered_links.txt")
                      break

          if os.path.exists(file_path):
              with open(file_path, "r") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      
                      if line.startswith("FOLDER_URL|"):
                          folder_url = line.split("|", 1)[1]
                          continue

                      parts = line.split("|")
                      size = int(parts[0])
                      node_id = parts[1]

                      if current_size + size > MAX_SIZE and current_batch:
                          batches.append(current_batch)
                          current_batch = []
                          current_size = 0

                      current_batch.append(node_id)
                      current_size += size

              if current_batch:
                  batches.append(current_batch)

          print(f"Generated {len(batches)} batches for folder: {folder_url}")

          token = "${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}"
          repo = "${{ github.repository }}"
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          TARGET_RELEASE = "downloads2"

          # 1. Ensure "downloads2" release exists
          release_url = f"https://api.github.com/repos/{repo}/releases/tags/{TARGET_RELEASE}"
          check_res = requests.get(release_url, headers=headers)

          if check_res.status_code == 404:
              create_url = f"https://api.github.com/repos/{repo}/releases"
              release_payload = {
                  "tag_name": TARGET_RELEASE,
                  "name": "downloads2",
                  "body": "Centralized release containing all downloaded batch files.",
                  "draft": False,
                  "prerelease": False
              }
              requests.post(create_url, headers=headers, json=release_payload)

          # 2. Trigger Workflow 3 for each batch
          dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/jdownloader-download-and-release.yml/dispatches"

          for i, batch in enumerate(batches):
              nodes_str = ",".join(batch)
              payload = {
                  "ref": "main",
                  "inputs": {
                      "folder_url": folder_url,
                      "node_ids": nodes_str,
                      "release_tag": TARGET_RELEASE
                  }
              }
              res = requests.post(dispatch_url, headers=headers, json=payload)
              print(f"Triggered batch {i+1} status: {res.status_code}")
          '
