name: 1. Fetch and Filter MEGA Links

on:
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'MEGA Folder URL'
        required: true
        type: string

jobs:
  fetch-and-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          sudo apt-get update
          python3 -m pip install mega.py requests

      - name: Extract Public Links via MEGA API (>100MB)
        run: |
          mkdir -p output
          
          python3 -c '
          import sys, os, re, json
          from mega import Mega

          url = "${{ inputs.mega_url }}"
          mega = Mega()
          
          # Anonymous login to MEGA API
          m = mega.login()

          print(f"Fetching contents for folder: {url}")
          try:
              # Get all files inside public folder
              files = m.get_public_url_info(url)
          except Exception as e:
              # Fallback to folder details parsing
              files = m.get_files_in_node(url)

          filtered_links = []
          min_bytes = 100 * 1024 * 1024  # 100MB

          # Parse returned file dictionary
          if isinstance(files, dict):
              for file_id, file_data in files.items():
                  size = file_data.get("s", 0)
                  # Filter files > 100MB
                  if size >= min_bytes:
                      # Generate link format: SIZE_BYTES|URL
                      file_url = file_data.get("url", f"https://mega.nz/file/{file_id}")
                      filtered_links.append(f"{size}|{file_url}")

          with open("output/filtered_links.txt", "w") as f:
              f.write("\n".join(filtered_links))

          print(f"Successfully exported {len(filtered_links)} files larger than 100MB.")
          '

      - name: Upload Filtered Links Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-filtered-links
          path: output/filtered_links.txt
