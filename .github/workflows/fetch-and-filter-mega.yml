name: 1. Fetch and Filter MEGA Links

on:
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'MEGA Folder URL'
        required: true
        type: string
      target_date:
        description: 'Timestamp for touch -d (Format: YYYY-MM-DD hh:mm)'
        required: true
        default: '2026-08-31 06:00'
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  fetch-and-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m pip install --no-cache-dir pycryptodome requests

      - name: Extract Public Links via MEGA API (>100MB)
        run: |
          mkdir -p output
          
          python3 -c '
          import os, re, json, requests

          url = "${{ inputs.mega_url }}".strip()
          target_date = "${{ inputs.target_date }}".strip()
          
          match = re.search(r"mega\.nz/(?:folder/|#F!)([^#?#]+)[#?!]([^#?&]+)", url)
          if not match:
              print("Invalid MEGA folder URL pattern.")
              exit(1)

          folder_id, folder_key = match.group(1), match.group(2)
          canonical_folder_url = f"https://mega.nz/folder/{folder_id}#{folder_key}"

          api_url = f"https://g.api.mega.co.nz/cs?id=0&n={folder_id}"
          payload = [{"a": "f", "c": 1, "r": 1}]
          
          response = requests.post(api_url, json=payload).json()
          files = response[0].get("f", []) if isinstance(response, list) and len(response) > 0 else []

          min_bytes = 100 * 1024 * 1024  # 100MB
          filtered_items = []

          for f in files:
              if f.get("t") == 0 and f.get("s", 0) >= min_bytes:
                  node_id = f.get("h")
                  size = f.get("s")
                  filtered_items.append(f"{size}|{node_id}")

          with open("output/filtered_links.txt", "w") as out:
              out.write(f"TARGET_DATE|{target_date}\n")
              out.write(f"FOLDER_URL|{canonical_folder_url}\n")
              out.write("\n".join(filtered_items))

          print(f"Exported {len(filtered_items)} files larger than 100MB")
          '

      - name: Upload Filtered Links Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-filtered-links
          path: output/filtered_links.txt
