name: 3. Download via MEGAcmd and Upload to GotoHP CLI

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: 'MEGA Folder URL'
        required: true
        type: string
      target_date:
        description: 'Timestamp to set (Format: YYYY-MM-DD)'
        required: true
        type: string
      gotohp_creds_key:
        description: 'GotoHP Creds Key'
        required: true
        type: string
      gotohp_user_email:
        description: 'GotoHP User Email'
        required: true
        type: string
      batches_matrix:
        description: 'JSON string array of batch node IDs'
        required: true
        type: string
      node_ids:
        description: 'Fallback single batch input'
        required: false
        type: string

jobs:
  parse-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          BATCHES_INPUT: ${{ inputs.batches_matrix }}
          SINGLE_INPUT: ${{ inputs.node_ids }}
        run: |
          python3 -c '
          import os, json

          batches_raw = os.environ.get("BATCHES_INPUT", "").strip()
          single_raw = os.environ.get("SINGLE_INPUT", "").strip()

          if batches_raw:
              matrix_data = json.loads(batches_raw)
          elif single_raw:
              matrix_data = [single_raw]
          else:
              matrix_data = []

          compact_json = json.dumps(matrix_data)
          
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={compact_json}\n")
          '

  download-process-upload:
    needs: parse-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.parse-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MEGAcmd and FFmpeg
        run: |
          UBUNTU_VERSION=$(lsb_release -rs)
          wget -q -P /tmp "https://mega.nz/linux/repo/xUbuntu_${UBUNTU_VERSION}/amd64/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" 
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" ffmpeg
          rm -f "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb"

      - name: Install gotohp-cli
        run: |
          curl -sL "https://github.com/xob0t/gotohp/releases/download/v0.10.0/gotohp-cli_amd64" -o /usr/local/bin/gotohp-cli
          chmod +x /usr/local/bin/gotohp-cli
          gotohp-cli --version || true

      - name: Download Files via MEGAcmd
        run: |
          mkdir -p raw_downloads
          cd raw_downloads

          FOLDER_URL="${{ inputs.folder_url }}"
          NODES=$(echo "${{ matrix.batch }}" | tr ',' ' ')
          
          for node_id in $NODES; do
            NODE_URL="${FOLDER_URL}/file/${node_id}"
            echo "Downloading file node: $NODE_URL"
            mega-get "$NODE_URL" ./ || true
          done

      - name: Deep Metadata Strip and Touch Original Filenames (Pure Bash)
        env:
          TZ: "UTC"
        run: |
          mkdir -p processed_downloads

          # 1. Parse target date and initialize base Epoch timestamp (06:00:00 + 4 hours offset = 10:00:00 UTC)
          TARGET_DATE="${{ inputs.target_date }}"
          BASE_EPOCH=$(date -u -d "${TARGET_DATE} 10:00:00" +%s)

          CURRENT_EPOCH=$BASE_EPOCH

          # 2. Loop through raw downloads using null-terminated file streams to handle special characters cleanly
          find raw_downloads -mindepth 1 -maxdepth 1 -type f -print0 | sort -z | while IFS= read -r -d '' file_path; do
            orig_filename=$(basename "$file_path")
            out_path="processed_downloads/$orig_filename"

            echo "Processing: $orig_filename"

            # 3. Deep strip container and stream-level metadata via ffmpeg
            ffmpeg -i "$file_path" \
              -map_metadata -1 \
              -map_metadata:s:v -1 \
              -map_metadata:s:a -1 \
              -c copy \
              -fflags +bitexact \
              "$out_path" -y || cp "$file_path" "$out_path"

            # 4. Format ISO date string directly from Epoch counter
            TOUCH_DATE=$(date -u -d "@$CURRENT_EPOCH" "+%Y-%m-%d %H:%M:%S")

            # 5. Apply touch -d directly after FFmpeg generates the processed output file
            touch -m -d "$TOUCH_DATE" "$out_path"

            # 6. Increment epoch time by 1 second per file
            CURRENT_EPOCH=$((CURRENT_EPOCH + 1))
          done

      - name: Verify Processed Files and Modification Timestamps
        run: |
          echo "=== VERIFYING PROCESSED FILES ==="
          ls -la --time-style=full-iso processed_downloads/

      - name: Configure Credentials and Upload via gotohp-cli
        run: |
          gotohp-cli creds add "${{ inputs.gotohp_creds_key }}"
          gotohp-cli creds set "${{ inputs.gotohp_user_email }}"

          gotohp-cli upload processed_downloads --recursive --threads 5 --force --no-tui
