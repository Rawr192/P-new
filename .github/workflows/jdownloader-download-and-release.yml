name: 3. Download via MEGAcmd and Upload to GotoHP CLI

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: 'MEGA Folder URL'
        required: true
        type: string
      node_ids:
        description: 'Comma-separated list of node IDs'
        required: true
        type: string
      target_date:
        description: 'Timestamp to set via touch -d'
        required: true
        type: string
      gotohp_creds_key:
        description: 'GotoHP Creds Key'
        required: true
        type: string
      gotohp_user_email:
        description: 'GotoHP User Email'
        required: true
        type: string

jobs:
  download-process-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MEGAcmd and ExifTool
        run: |
          UBUNTU_VERSION=$(lsb_release -rs)
          wget -q -P /tmp "https://mega.nz/linux/repo/xUbuntu_${UBUNTU_VERSION}/amd64/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" 
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" exiftool
          rm -f "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb"

      - name: Install gotohp-cli
        run: |
          # Fetch release info with proper headers
          RELEASE_JSON=$(curl -sH "User-Agent: GitHubActions" https://api.github.com/repos/xob0t/gotohp/releases/latest)

          # Case-insensitive search for the Linux asset download URL
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | ascii_downcase | contains("linux")) | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Failed to locate Linux binary asset in GitHub Release."
            exit 1
          fi

          echo "Downloading gotohp-cli from: $DOWNLOAD_URL"
          mkdir -p /tmp/gotohp
          curl -sL "$DOWNLOAD_URL" -o /tmp/gotohp/asset

          # Unpack dynamic asset type (archive vs raw executable)
          if file /tmp/gotohp/asset | grep -q 'Zip archive'; then
            unzip -o /tmp/gotohp/asset -d /tmp/gotohp/
            find /tmp/gotohp -type f ! -name "*.zip" -exec mv {} /usr/local/bin/gotohp-cli \;
          elif file /tmp/gotohp/asset | grep -q 'gzip compressed'; then
            tar -xzf /tmp/gotohp/asset -C /tmp/gotohp/
            find /tmp/gotohp -type f ! -name "*.tar.gz" -exec mv {} /usr/local/bin/gotohp-cli \;
          else
            mv /tmp/gotohp/asset /usr/local/bin/gotohp-cli
          fi

          chmod +x /usr/local/bin/gotohp-cli
          rm -rf /tmp/gotohp
          gotohp-cli --version || true

      - name: Download Files via MEGAcmd
        run: |
          mkdir -p raw_downloads
          cd raw_downloads

          FOLDER_URL="${{ inputs.folder_url }}"
          NODES=$(echo "${{ inputs.node_ids }}" | tr ',' ' ')
          
          for node_id in $NODES; do
            NODE_URL="${FOLDER_URL}/file/${node_id}"
            echo "Downloading file node: $NODE_URL"
            mega-get "$NODE_URL" ./ || true
          done

      - name: Strip Media Metadata and Touch Filesystem Timestamp
        run: |
          # Strip internal EXIF/creation metadata
          exiftool -all= -overwrite_original raw_downloads/ || true

          # Update modification/access time using touch -d
          touch -d "${{ inputs.target_date }}" raw_downloads/*

      - name: Configure Credentials and Upload via gotohp-cli
        run: |
          # Register credentials passed directly from input
          gotohp-cli creds add "${{ inputs.gotohp_creds_key }}"
          gotohp-cli creds set "${{ inputs.gotohp_user_email }}"

          # Multi-threaded recursive upload
          gotohp-cli upload raw_downloads --recursive --threads 5
