name: 3. Download via Megatools and Upload to Release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Comma-separated list of URLs to download'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release Tag'
        required: true
        default: 'downloads'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Megatools
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: Download Files via Megatools
        run: |
          mkdir -p raw_downloads
          cd raw_downloads
          
          IFS=',' read -ra URL_LIST <<< "${{ inputs.urls }}"
          for url in "${URL_LIST[@]}"; do
            echo "Downloading MEGA URL: $url"
            megadl --path . "$url" || true
          done

      - name: Process & Split Files Exceeding 2GB Limit
        run: |
          mkdir -p release_assets
          
          for filepath in raw_downloads/*; do
            if [ -f "$filepath" ]; then
              filename=$(basename "$filepath")
              filesize=$(stat -c%s "$filepath")
              maxsize=2147483648  # 2 GB limit

              if [ "$filesize" -gt "$maxsize" ]; then
                echo "File $filename is larger than 2GB ($filesize bytes). Splitting into 2000M parts..."
                split -b 2000M -d --additional-suffix=.part "$filepath" "release_assets/${filename}."
              else
                echo "File $filename is under 2GB ($filesize bytes). Moving as-is."
                cp "$filepath" release_assets/
              fi
            fi
          done

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "downloads"
          draft: false
          prerelease: false
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
