name: 3. Download via MEGAcmd and Upload to Release

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: 'MEGA Folder URL'
        required: true
        type: string
      node_ids:
        description: 'Comma-separated list of node IDs'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release Tag'
        required: true
        default: 'downloads3'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MEGAcmd
        run: |
          UBUNTU_VERSION=$(lsb_release -rs)
          wget -q -P /tmp "https://mega.nz/linux/repo/xUbuntu_${UBUNTU_VERSION}/amd64/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" 
          sudo apt-get install -y --no-install-recommends "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb"
          rm -f "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb"

      - name: Verify MEGAcmd Installation
        run: mega-version

      - name: Download Files via MEGAcmd
        run: |
          mkdir -p raw_downloads3
          cd raw_downloads3

          FOLDER_URL="${{ inputs.folder_url }}"
          NODES=$(echo "${{ inputs.node_ids }}" | tr ',' ' ')
          
          for node_id in $NODES; do
            # Build valid MEGA folder-file node link
            NODE_URL="${FOLDER_URL}/file/${node_id}"
            
            echo "Downloading file node: $NODE_URL"
            mega-get "$NODE_URL" ./ || true
          done

      - name: Process & Split Files Exceeding 2GB Limit
        run: |
          mkdir -p release_assets
          
          for filepath in raw_downloads3/*; do
            if [ -f "$filepath" ]; then
              filename=$(basename "$filepath")
              filesize=$(stat -c%s "$filepath")
              maxsize=2147483648  # 2 GB limit

              if [ "$filesize" -gt "$maxsize" ]; then
                echo "File $filename exceeds 2GB ($filesize bytes). Splitting into 2000M chunks..."
                split -b 2000M -d --additional-suffix=.part "$filepath" "release_assets/${filename}."
              else
                cp "$filepath" release_assets/
              fi
            fi
          done

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "downloads3"
          draft: false
          prerelease: false
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
