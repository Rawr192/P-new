name: 3. Download via MEGAcmd and Upload to GotoHP CLI

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: 'MEGA Folder URL'
        required: true
        type: string
      node_ids:
        description: 'Comma-separated list of node IDs'
        required: true
        type: string
      target_date:
        description: 'Timestamp to set via touch -d'
        required: true
        type: string
      gotohp_creds_key:
        description: 'GotoHP Creds Key'
        required: true
        type: string
      gotohp_user_email:
        description: 'GotoHP User Email'
        required: true
        type: string
      worker_slot:
        description: 'Concurrency worker slot (worker-1 or worker-2)'
        required: false
        default: 'worker-1'
        type: string

# Limits maximum parallel executions of Workflow 3 to 2 runs (Worker 1 and Worker 2)
concurrency:
  group: gotohp-upload-${{ inputs.worker_slot }}
  cancel-in-progress: false

jobs:
  download-process-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MEGAcmd and FFmpeg
        run: |
          UBUNTU_VERSION=$(lsb_release -rs)
          wget -q -P /tmp "https://mega.nz/linux/repo/xUbuntu_${UBUNTU_VERSION}/amd64/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" 
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" ffmpeg
          rm -f "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb"

      - name: Install gotohp-cli
        run: |
          curl -sL "https://github.com/xob0t/gotohp/releases/download/v0.10.0/gotohp-cli_amd64" -o /usr/local/bin/gotohp-cli
          chmod +x /usr/local/bin/gotohp-cli
          gotohp-cli --version || true

      - name: Download Files via MEGAcmd
        run: |
          mkdir -p raw_downloads
          cd raw_downloads

          FOLDER_URL="${{ inputs.folder_url }}"
          NODES=$(echo "${{ inputs.node_ids }}" | tr ',' ' ')
          
          for node_id in $NODES; do
            NODE_URL="${FOLDER_URL}/file/${node_id}"
            echo "Downloading file node: $NODE_URL"
            mega-get "$NODE_URL" ./ || true
          done

      - name: Strip Media Metadata with FFmpeg and Touch Timestamp
        run: |
          mkdir -p processed_downloads

          # Strip metadata streams without re-encoding video/audio (-c copy)
          for file in raw_downloads/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              ffmpeg -i "$file" -map_metadata -1 -c copy "processed_downloads/$filename" -y || mv "$file" "processed_downloads/$filename"
            fi
          done

          # Update modification and access timestamps on processed files
          touch -d "${{ inputs.target_date }}" processed_downloads/*

      - name: Configure Credentials and Upload via gotohp-cli
        run: |
          # Register credentials passed directly from input
          gotohp-cli creds add "${{ inputs.gotohp_creds_key }}"
          gotohp-cli creds set "${{ inputs.gotohp_user_email }}"

          # Multi-threaded recursive upload of processed directory
          gotohp-cli upload processed_downloads --recursive --threads 5
